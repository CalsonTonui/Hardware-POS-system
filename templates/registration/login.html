{% extends 'base.html' %}

{% block title %}
Login - Hardware POS
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5 col-lg-4">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <div class="mb-3">
                        <i class="bi bi-shop fs-1 text-primary"></i>
                    </div>

                    <h3 class="fw-bold">Hardware POS</h3>

                    <p class="text-muted">
                        Sign in to continue
                    </p>

                </div>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
