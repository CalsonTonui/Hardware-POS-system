
<div class="col-md-2 bg-dark text-white vh-100 p-0">

    <div class="text-center py-4 border-bottom">
        <h4 class="fw-bold">
            <i class="bi bi-shop"></i> Hardware POS
        </h4>
    </div>

    <div class="list-group list-group-flush">

        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <!-- Products -->
        <a href="{% url 'products' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-box-seam me-2"></i> Products
        </a>

        <!-- Inventory -->
        <a href="{% url 'inventory_list' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-boxes me-2"></i> Inventory
        </a>

        <!-- Purchases -->
        <a href="{% url 'purchase_list' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-cart-plus me-2"></i> Purchases
        </a>

        <!-- Sales -->
        <a href="{% url 'sale_list' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-cart-check me-2"></i> Sales
        </a>

        <!-- Customers -->
        <a href="#"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-people me-2"></i> Customers
        </a>

        <!-- Suppliers -->
        <a href="{% url 'supplier_list' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-truck me-2"></i> Suppliers
        </a>

                <!-- Reports -->
        <a href="{% url 'reports_dashboard' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports
        </a>

                <!-- Expenses -->
        <a href="{% url 'expense_list' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-cash-stack me-2"></i> Expenses
        </a>

              <!-- Settings -->
        <a href="{% url 'settings' %}"
           class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-gear me-2"></i> Settings
        </a>

            <!-- Logout -->
    <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}

        <button type="submit"
                class="list-group-item list-group-item-action bg-dark text-white border-0 w-100 text-start">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
    </form>
    </div>

</div>
