{% load static %}

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}Hardware POS{% endblock %}
</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
    rel="stylesheet">

<!-- Custom CSS -->
<link
    rel="stylesheet"
    href="{% static 'css/style.css' %}">

<!-- Page-specific CSS -->
{% block extra_css %}
{% endblock %}

</head>

<body>

<!-- Navigation Bar -->
{% include 'navbar.html' %}


<div class="pos-layout">

    <!-- Sidebar -->
    {% include 'sidebar.html' %}


    <!-- Main Content -->
    <main class="pos-main-content">

        <!-- Django Messages -->
        {% include 'messages.html' %}


        <!-- Page Content -->
        {% block content %}
        {% endblock %}

    </main>

</div>


<!-- Footer -->
{% include 'footer.html' %}


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- POS Alert JavaScript -->
<script>

    document.addEventListener("DOMContentLoaded", function () {

        const alerts = document.querySelectorAll(".pos-alert");

        alerts.forEach(function (alert) {

            setTimeout(function () {

                hidePosAlert(alert);

            }, 3000);

        });

    });


    function closePosAlert(button) {

        const alert = button.closest(".pos-alert");

        if (alert) {

            hidePosAlert(alert);

        }

    }


    function hidePosAlert(alert) {

        if (alert.classList.contains("pos-alert-hide")) {

            return;

        }

        alert.classList.add("pos-alert-hide");

        setTimeout(function () {

            alert.remove();

        }, 300);

    }

</script>
<!-- Sidebar JavaScript -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    const sidebarToggle = document.getElementById("sidebarToggle");

    if (!sidebarToggle) {
        return;
    }


    sidebarToggle.addEventListener("click", function () {

        if (window.innerWidth <= 768) {

            document.body.classList.toggle("sidebar-mobile-open");

        } else {

            document.body.classList.toggle("sidebar-collapsed");

        }

    });


    /*
     * Close mobile sidebar when a navigation link is clicked
     */
    const sidebarLinks = document.querySelectorAll(
        ".sidebar-link[href]"
    );


    sidebarLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            if (window.innerWidth <= 768) {

                document.body.classList.remove(
                    "sidebar-mobile-open"
                );

            }

        });

    });


    /*
     * Remember collapsed state
     */
    if (
        window.innerWidth > 768 &&
        localStorage.getItem("sidebarCollapsed") === "true"
    ) {

        document.body.classList.add("sidebar-collapsed");

    }


    /*
     * Save collapsed state
     */
    sidebarToggle.addEventListener("click", function () {

        if (window.innerWidth > 768) {

            const collapsed =
                document.body.classList.contains(
                    "sidebar-collapsed"
                );

            localStorage.setItem(
                "sidebarCollapsed",
                collapsed
            );

        }

    });

});

</script>

<!-- Page-specific JavaScript -->
{% block extra_js %}
{% endblock %}

</body>

</html>
