{% load static %}

<nav class="navbar navbar-dark bg-primary pos-navbar shadow-sm">
    <div class="container-fluid pos-navbar-container">

        <!-- ========================================================= -->
        <!-- LEFT: LOGO -->
        <!-- ========================================================= -->
        <div class="navbar-brand d-flex align-items-center" style="gap: 14px; margin: 0;">
            <img src="{% static 'images/logo.png' %}"
                 alt="Carolivan Logo"
                 style="height: 52px;
                        width: 52px;
                        object-fit: contain;
                        background: #ffffff;
                        border-radius: 10px;
                        padding: 4px;
                        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);">
        </div>

        <!-- ========================================================= -->
        <!-- CENTER: BUSINESS NAME -->
        <!-- ========================================================= -->
        <div class="pos-navbar-brand d-none d-md-block">
            <span class="fw-bold">CAROLIVAN-PKEMOI HARDWARE &amp; GENERAL SUPPLIES</span>
        </div>

        <!-- ========================================================= -->
        <!-- RIGHT: THEME TOGGLE + USER DROPDOWN -->
        <!-- ========================================================= -->
        {% if request.user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">

            <!-- Theme Toggle Button -->
            <button type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    title="Toggle dark mode"
                    aria-label="Toggle dark mode"
                    onclick="toggleTheme()">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>

            <!-- User Dropdown -->
            <div class="dropdown">
                <button class="btn btn-primary d-flex align-items-center user-menu-btn"
                    type="button"
                    id="userDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <!-- Avatar with initials -->
                <div class="user-avatar-sm me-2">
                    {% if request.user.first_name and request.user.last_name %}
                        {{ request.user.first_name|first|upper }}{{ request.user.last_name|first|upper }}
                    {% else %}
                        {{ request.user.username|first|upper }}
                    {% endif %}
                </div>

                <div class="admin-details text-start d-none d-sm-block me-2">
                    <span class="d-block fw-bold small">
                        {{ request.user.get_full_name|default:request.user.username }}
                    </span>
                    <span class="d-block small text-white-50">
                        {{ request.user.get_role_display }}
                    </span>
                </div>

                <!-- Dropdown caret -->
                <i class="bi bi-chevron-down user-menu-caret"></i>
            </button>

                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item" href="{% url 'profile' %}">
                            <i class="bi bi-person me-2"></i>My Profile
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>

        </div>
        {% endif %}

    </div>
</nav>
